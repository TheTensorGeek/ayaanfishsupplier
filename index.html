<!DOCTYPE html>
<html>
<head>
  <title>Ayaan Fish Supplier</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    h1 { color: #0a5c36; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin: 10px;
      display: inline-block;
      width: 230px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    img {
      width: 200px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }
    .price { font-weight: bold; }
    a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<h1>🐟 Ayaan Fish Supplier</h1>
<p>Fresh seafood delivered in Mumbai | Daily fresh catch</p>

<div class="card">
  <img src="pomfret.jpg">
  <h3>Pomfret</h3>
  <p class="price">₹800/kg</p>
  <a href="https://wa.me/91XXXXXXXXXX?text=Hi Ayaan Fish Supplier, I want Pomfret 1kg">Order</a>
</div>

<div class="card">
  <img src="rohu.jpg">
  <h3>Rohu</h3>
  <p class="price">₹250/kg</p>
  <a href="https://wa.me/91XXXXXXXXXX?text=Hi Ayaan Fish Supplier, I want Rohu 1kg">Order</a>
</div>

<div class="card">
  <img src="surmai.jpg">
  <h3>Surmai</h3>
  <p class="price">₹600/kg</p>
  <a href="https://wa.me/91XXXXXXXXXX?text=Hi Ayaan Fish Supplier, I want Surmai 1kg">Order</a>
</div>

</body>
</html>
